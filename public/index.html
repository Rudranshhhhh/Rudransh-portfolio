<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="description" content="RUDRANSH.OS — Personal portfolio of Rudransh, CS Engineering Student" />
    <title>RUDRANSH.OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      body { background: #0a0a0f; color: #e2e2f0; font-family: 'Inter', system-ui, sans-serif; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #2a2a3d; border-radius: 2px; }
      ::-webkit-scrollbar-thumb:hover { background: #4a4a68; }
      ::selection { background: rgba(79,142,247,0.3); color: #e2e2f0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
